<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dypsy Visualizer - Luxury</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --blue: #00d2ff; --purple: #3a7bd5; --glass: rgba(255, 255, 255, 0.05); }
        * { margin:0; padding:0; box-sizing:border-box; }
        
        @keyframes extremeFloat {
            0% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-20px) rotate(1.2deg); }
            50% { transform: translateY(0) rotate(-1.2deg); }
            75% { transform: translateY(15px) rotate(0.6deg); }
            100% { transform: translateY(0) rotate(0deg); }
        }

        body { 
            background: radial-gradient(circle at top right, #0f172a, #020617, #000); 
            color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; min-height: 100vh; 
            padding: 40px 15px; display: flex; justify-content: center; overflow-x: hidden;
        }

        .container { width: 100%; max-width: 800px; perspective: 1200px; }
        
        .main-card { 
            background: var(--glass); backdrop-filter: blur(40px);
            border: 1px solid rgba(255,255,255,0.12); border-radius: 35px; 
            padding: 30px; animation: extremeFloat 9s infinite ease-in-out;
            box-shadow: 0 40px 100px rgba(0,0,0,0.8);
        }

        .dash-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 20px 0; }
        .stat-box { 
            background: rgba(0,0,0,0.4); padding: 15px; border-radius: 20px; 
            border: 1px solid rgba(255,255,255,0.08); text-align: center;
        }
        .stat-box b { color: var(--blue); font-size: 1rem; text-shadow: 0 0 10px var(--blue); }
        .stat-box span { font-size: 0.65rem; color: #64748b; text-transform: uppercase; }

        .input-wrapper { 
            display: flex; background: rgba(0,0,0,0.6); padding: 6px; 
            border-radius: 18px; border: 1px solid rgba(255,255,255,0.1); gap: 8px;
            align-items: center;
        }
        input { 
            flex: 1; background: transparent; border: none; padding: 10px 15px; 
            color: #fff; outline: none; font-size: 0.9rem; min-width: 0; 
        }
        button { 
            background: linear-gradient(135deg, var(--blue), var(--purple)); 
            border: none; padding: 10px 20px; border-radius: 14px; color: #fff; 
            font-weight: 800; cursor: pointer; font-size: 0.8rem; transition: 0.3s;
            white-space: nowrap;
        }
        button:hover { transform: scale(1.05); box-shadow: 0 0 15px var(--blue); }

        /* AREA KODE DENGAN TOMBOL SALIN */
        .code-container { position: relative; margin-top: 20px; }
        
        .btn-copy {
            position: absolute; top: 10px; right: 10px;
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
            color: #fff; padding: 5px 12px; border-radius: 8px; font-size: 0.7rem;
            cursor: pointer; transition: 0.3s; z-index: 10;
        }
        .btn-copy:hover { background: var(--blue); border-color: var(--blue); }

        .code-view { 
            background: rgba(0,0,0,0.5); border-radius: 25px; 
            padding: 20px; border: 1px solid rgba(255,255,255,0.08); max-height: 300px; 
            overflow: auto; white-space: pre-wrap; word-break: break-all;
            font-family: 'Courier New', monospace; font-size: 0.8rem; color: #94a3b8;
        }
    </style>
</head>
<body>
    <div class="container">
        <header style="text-align: center; margin-bottom: 30px;">
            <h1 style="font-size: 2.2rem; font-weight: 900; background: linear-gradient(to right, #fff, var(--blue)); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Dypsy Visualizer</h1>
        </header>

        <div class="main-card">
            <img src="https://images.unsplash.com/photo-1550751827-4bd374c3f58b?w=800" style="width:100%; height:150px; object-fit:cover; border-radius:25px; margin-bottom:15px; opacity: 0.7;">
            
            <div class="dash-grid">
                <div class="stat-box"><span>Ping</span><br><b>2ms</b></div>
                <div class="stat-box"><span>Node</span><br><b>Lux</b></div>
                <div class="stat-box"><span>Sec</span><br><b style="color: #10b981;">On</b></div>
            </div>

            <div class="input-wrapper">
                <input type="text" id="target" placeholder="https://target.com">
                <button onclick="viz()">ANALYZE</button>
            </div>
            
            <div class="code-container">
                <button class="btn-copy" onclick="copyCode()"><i class="fas fa-copy"></i> COPY</button>
                <div class="code-view" id="out">// Ready to fetch...</div>
            </div>
        </div>
    </div>

    <script>
        async function viz() {
            const u = document.getElementById('target').value;
            if(!u) return;
            const output = document.getElementById('out');
            output.innerText = "Decrypting protocols...";
            
            try {
                const r = await fetch(`https://api.resellergaming.my.id/tools/getcode?url=${encodeURIComponent(u)}`);
                const d = await r.json();
                // Menggunakan innerText agar tag HTML tidak dieksekusi browser tapi muncul sebagai teks
                output.innerText = d.result.html || "Empty data.";
            } catch(e) { 
                output.innerText = "Error Handshake. Pastikan URL benar atau API aktif."; 
            }
        }

        function copyCode() {
            const codeText = document.getElementById('out').innerText;
            if (codeText === "// Ready to fetch..." || codeText === "Decrypting protocols...") return;

            navigator.clipboard.writeText(codeText).then(() => {
                const btn = document.querySelector('.btn-copy');
                btn.innerHTML = '<i class="fas fa-check"></i> COPIED!';
                btn.style.background = "#10b981";
                
                setTimeout(() => {
                    btn.innerHTML = '<i class="fas fa-copy"></i> COPY';
                    btn.style.background = "rgba(255,255,255,0.1)";
                }, 2000);
            }).catch(err => {
                alert("Gagal menyalin: " + err);
            });
        }
    </script>
</body>
</html>
